{% extends "soilhealth/base.html" %}
{% load static %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
  <div class="card shadow-lg p-5" style="max-width: 650px; width: 100%; border-radius: 18px; background-color: #f9fdf9;">

    <!-- Title -->
    <h2 class="text-center mb-4" style="color: #2f7a3e; font-weight: bold;">
      🌱 Test Your Soil
    </h2>
    <p class="text-center text-muted mb-4">
      Enter your farm’s soil details to receive a tailored diagnosis.
    </p>

    <!-- Soil Form -->
    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label for="farmer_name" class="form-label">Farmer Name</label>
        <input type="text" class="form-control" name="farmer_name" required>
      </div>

      <div class="mb-3">
        <label for="location" class="form-label">Location</label>
        <input type="text" class="form-control" name="location" required>
      </div>

      <div class="mb-3">
        <label for="ph" class="form-label">Soil pH</label>
        <input type="number" step="0.1" class="form-control" name="ph" required>
      </div>

      <div class="mb-3">
        <label for="organic_matter" class="form-label">Organic Matter (%)</label>
        <input type="number" step="0.1" class="form-control" name="organic_matter" required>
      </div>

      <div class="mb-3">
        <label for="nitrogen" class="form-label">Nitrogen (mg/kg)</label>
        <input type="number" step="0.1" class="form-control" name="nitrogen" required>
      </div>

      <div class="mb-3">
        <label for="phosphorus" class="form-label">Phosphorus (mg/kg)</label>
        <input type="number" step="0.1" class="form-control" name="phosphorus" required>
      </div>

      <div class="mb-3">
        <label for="potassium" class="form-label">Potassium (mg/kg)</label>
        <input type="number" step="0.1" class="form-control" name="potassium" required>
      </div>

      <div class="mb-3">
        <label for="crop" class="form-label">Select Crop</label>
        <select name="crop" class="form-select" required>
          {% for crop in crops %}
            <option value="{{ crop.id }}">{{ crop.name }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Submit Button -->
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-success px-5 py-2" style="border-radius: 12px; font-size: 1.1rem;">
          Get Diagnosis
        </button>
      </div>
    </form>

  </div>
</div>
{% endblock %}
