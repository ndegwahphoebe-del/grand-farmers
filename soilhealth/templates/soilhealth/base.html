{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grand Farmers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap for farmer-friendly UI -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'soilhealth:home' %}">🌱 Grand Farmers</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'soilhealth:home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'soilhealth:soil_sample' %}">Run Soil Test</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'soilhealth:recommendations' %}">Recommendations</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'soilhealth:climate_insights' %}">Climate Insights</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <div class="container mb-5">
        {% block content %}
        <!-- Each page will inject content here -->
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer class="bg-success text-white text-center p-3">
        © 2025 Grand Farmers — Growing Healthy Soils, One Farm at a Time.
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
